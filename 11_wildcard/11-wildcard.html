<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Redirect</title>
  <style>
    body {
      background: #282c34;
      color: #61dafb;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .textbox {
      max-width: 600px;
      background: #20232a;
      border-radius: 12px;
      padding: 20px;
      font-size: 1.2rem;
      line-height: 1.5;
      box-shadow: 0 8px 15px rgba(97, 218, 251, 0.3);
      margin-bottom: 30px;
    }
    button {
      background-color: #61dafb;
      color: #20232a;
      border: none;
      padding: 15px 35px;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      box-shadow: 0 6px 12px rgba(97, 218, 251, 0.6);
      user-select: none;
    }
    button:hover {
      background-color: #21a1f1;
    }
  </style>
</head>
<body>
  <div class="textbox">
    <p>
      For my integrated project, I designed and built the final casing, which includes the 3D-printed top section, the central console, and a wooden enclosure at the bottom that houses the power jack. Check out the final project down below!
    </p>
  </div>
  <button id="goButton">Final Project</button>

  <script>
    const button = document.getElementById('goButton');
    button.addEventListener('click', () => {
      window.location.href = 'https://fulcrum-08.github.io/PS70/14_finalProject/14-final-project-presentation.html'; // Predetermined website here
    });
  </script>
</body>
</html>
